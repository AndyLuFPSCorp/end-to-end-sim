<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Fries cooler cell</title>
<script type="importmap">{"imports":{"three":"../coffee_bar_3d/vendor/three.module.js","three/addons/":"../coffee_bar_3d/vendor/"}}</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c2430; background: #f3f5f7; }
  #view { position: fixed; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; }
  .panel { position: absolute; background: rgba(255,255,255,.92); border: 1px solid #d8dee4; border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 18px rgba(20,30,40,.08); }
  #controls { top: 14px; left: 14px; width: min(360px, calc(100vw - 28px)); }
  #readout { top: 14px; right: 14px; width: 270px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: #66717d; font-size: 12px; margin-bottom: 10px; }
  #phase { font-weight: 600; margin: 6px 0; min-height: 18px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button, select { font: inherit; padding: 4px 10px; border: 1px solid #c5ced6; border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { background: #eef2f5; }
  #scrub { width: 100%; }
  #clock { font-variant-numeric: tabular-nums; color: #4b5663; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
  dt { color: #66717d; }
  dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  .temp { font-size: 22px; font-weight: 600; color: #1d5fa8; text-align: right; }
  #status { position: absolute; left: 14px; bottom: 12px; color: #4b5663; background: rgba(255,255,255,.8); padding: 4px 8px; border-radius: 6px; }
  @media (max-width: 720px) { #readout { top: auto; bottom: 44px; } }
</style>
</head>
<body>
<div id="view">
  <canvas id="scene" aria-label="Fries cooler cell 3D scene"></canvas>
  <section id="controls" class="panel">
    <h1>Fries cooler cell</h1>
    <div class="sub">Conveyor → Nova-5 scoop → insulated cooler → disposal</div>
    <div id="phase"></div>
    <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Timeline">
    <div class="row">
      <button id="play">Pause</button>
      <button id="restart">Restart</button>
      <select id="speed" aria-label="Speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="1" selected>1×</option><option value="2">2×</option>
      </select>
      <span id="clock"></span>
    </div>
    <div class="row">
      <label><input id="section" type="checkbox"> Section view</label>
      <label><input id="labels" type="checkbox" checked> Labels</label>
      <button id="home">Home</button>
      <button id="focus">Cooler</button>
    </div>
  </section>
  <section id="readout" class="panel">
    <dl>
      <dt>RTD (Pt100)</dt><dd class="temp" id="rtd">–</dd>
      <dt></dt><dd id="rtd-ohm">–</dd>
      <dt>Lid</dt><dd id="lid">–</dd>
      <dt>Bottom door</dt><dd id="door">–</dd>
      <dt>Fries</dt><dd id="fries">–</dd>
    </dl>
  </section>
  <div id="status">Loading…</div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
